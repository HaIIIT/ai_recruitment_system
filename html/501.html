    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
        color: #1e293b;
      }

      .error-container {
        width: 100%;
        max-width: 620px;
        padding: 50px 30px;
        text-align: center;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(15, 88, 190, 0.15);
      }

      .error-code {
        font-size: clamp(80px, 20vw, 150px);
        line-height: 1;
        font-weight: 800;
        color: #1976d2;
        margin-bottom: 18px;
      }

      .error-title {
        margin-bottom: 14px;
        font-size: 28px;
        color: #0f172a;
      }

      .error-description {
        max-width: 460px;
        margin: 0 auto 30px;
        font-size: 16px;
        line-height: 1.7;
        color: #64748b;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 190px;
        padding: 13px 24px;
        border: none;
        border-radius: 8px;
        color: #ffffff;
        background-color: #1976d2;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s;
      }

      .back-button:hover {
        background-color: #125ea9;
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(25, 118, 210, 0.25);
      }
      .back-button:active {
        transform: translateY(0);
      }
      .contact-link {
        display: block;
        margin-top: 18px;
      }

      @media (max-width: 480px) {
        .error-container {
          padding: 40px 20px;
        }

        .error-title {
          font-size: 23px;
        }

        .back-button {
          width: 100%;
        }
      }
    </style>

    <script>
      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "index.html";
        }
      }
